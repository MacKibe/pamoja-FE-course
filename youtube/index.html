<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Maskani</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- Logo -->
      <section class="logo_section">
        <button type="button">
          <img src="./assets/hamburger.svg" alt="hamburger icon" />
        </button>
        <a href="#" class="logo">
          <img src="./assets/maskani_logo.svg" alt="Maskani logo icon" />
        </a>
      </section>
      <!-- Search area -->
      <section class="search_area">
        <form>
          <input
            type="text"
            name="searched_name"
            id="searched_name"
            placeholder="Search..."
          />
          <button type="submit">
            <img src="./assets/search.svg" alt="search icon" />
          </button>
        </form>
        <button type="button">
          <img src="./assets/mic.svg" alt="mic search icon" />
        </button>
      </section>
      <!-- Profile area -->
      <section class="profile_area">
        <div class="create_btn">
          <img src="./assets/add.svg" alt="create icon" />
          <span>Create</span>
        </div>

        <img src="./assets/notifications.svg" alt="notifications icon" />

        <button type="button" class="user_profile">
          <img src="./assets/me.jpg" alt="user's profile icon" />
        </button>
      </section>
    </header>
    <div>
      <!-- Side Panel -->
      <aside></aside>
      <!-- Main -->
      <main></main>
    </div>
  </body>
</html>
